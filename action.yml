name: action-slack-deployment-message
description: Send a Slack message announcing the result of a deployment

inputs:
  SLACK_BOT_TOKEN:
    description: The Slack bot token used to authenticate the message post
    required: true
  SLACK_CHANNEL:
    description: The Slack channel (name or ID) to post the message to
    required: true
  PROJECT:
    description: The name of the project being deployed
    required: true
  COMPONENT:
    description: The name of the component being deployed
    required: true
  VERSION:
    description: The version being deployed
    required: true
  ENVIRONMENT:
    description: The environment being deployed to
    required: true
  JOB_STATUS:
    description: >-
      The result of the deployment. One of "success", "failure", or "cancelled".
      Should be passed as the `job.status` field.

      See https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
    required: true

runs:
  using: composite
  steps:
    -
      name: Construct complex values for message
      shell: bash
      id: message-values
      env:
        INPUT_JOB_STATUS: ${{ inputs.JOB_STATUS }}
        INPUT_VERSION: ${{ inputs.VERSION }}
      run: |
        # Pick friendly name and attachment color per status
        STATUS_NAME=""
        ATTACHMENT_COLOR=""

        case "$INPUT_JOB_STATUS" in
          success)
            STATUS_NAME="succeeded"
            ATTACHMENT_COLOR="#2e7d32"
            ;;
          failure)
            STATUS_NAME="failed"
            ATTACHMENT_COLOR="#d32f2f"
            ;;
          cancelled)
            STATUS_NAME="was cancelled"
            ATTACHMENT_COLOR="#6d6d6d"
            ;;
          *)
            echo "::error::Unrecognized JOB_STATUS '$INPUT_JOB_STATUS'. Expected 'success', 'failure', or 'cancelled'."
            exit 1
            ;;
        esac

        echo "status=$FRIENDLY_NAME" | tee -a "$GITHUB_OUTPUT"
        echo "attachment-color=$ATTACHMENT_COLOR" | tee -a "$GITHUB_OUTPUT"

        # url-encode the version ref
        VERSION_ENCODED=$(printf '%s' "${INPUT_VERSION}" | jq -sRrc '@uri')

        # Construct a URL to the version's release
        RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION_ENCODED}"
        echo "release-url=${RELEASE_URL}" | tee -a "$GITHUB_OUTPUT"

        # Construct a URL to the current run
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
        echo "run-url=${RUN_URL}" | tee -a "$GITHUB_OUTPUT"
    -
      name: Construct message payload, for easy previewing
      id: slack-message
      shell: bash
      env:
        SLACK_PAYLOAD: |
          channel: "${{ inputs.SLACK_CHANNEL }}"
          text: "Deployment of ${{ inputs.PROJECT }}/${{ inputs.COMPONENT }} to ${{ inputs.ENVIRONMENT }} ${{ steps.message-values.outputs.job-status }}"
          attachments:
            - color: "${{ steps.message-values.outputs.attachment-color }}"
              blocks:
                - type: rich_text
                  elements:
                    - type: rich_text_section
                      elements:
                        - type: text
                          text: 'Component:'
                          style:
                            bold: true
                        - type: text
                          text: "\t\t"
                        - type: text
                          text: '${{ inputs.PROJECT }}/${{ inputs.COMPONENT }}'
                    - type: rich_text_section
                      elements:
                        - type: text
                          text: 'Version:'
                          style:
                            bold: true
                        - type: text
                          text: "\t\t\t"
                        - type: link
                          text: '${{ inputs.VERSION }}'
                          url: '${{ steps.message-values.outputs.release-url }}'
                    - type: rich_text_section
                      elements:
                        - type: text
                          text: 'Deployed to:'
                          style:
                            bold: true
                        - type: text
                          text: "\t\t"
                        - type: text
                          text: dev
                - type: context
                  elements:
                    - type: mrkdwn
                      text: 'To view this deployment, <${{ steps.message-values.outputs.run-url }}|click here>'
      run: |
        echo "$SLACK_PAYLOAD" | yq '.'

        COMPACT_PAYLOAD=$(echo "$SLACK_PAYLOAD" | yq -o=json -I0 '.')
        echo "payload=$COMPACT_PAYLOAD" >> "$GITHUB_OUTPUT"
    -
      name: Send Slack message
      uses: slackapi/slack-github-action@v2.1.1
      with:
        errors: true
        method: chat.postMessage
        token: ${{ inputs.SLACK_BOT_TOKEN }}
        payload: $${{ steps.slack-message.outputs.payload }}

branding:
  icon: message-square
  color: 'green'
